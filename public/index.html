<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>营销雷达 Marketing Radar</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="logo" href="#"><span class="logo-mark">MH</span><span class="logo-text">MARKETING<b>HOT</b></span></a>
        <nav class="nav" aria-label="主要栏目">
          <button class="nav-btn active" data-view="featured">精选</button>
          <button class="nav-btn" data-view="trends">趋势观察</button>
          <button class="nav-btn" data-view="all">全部动态</button>
          <button class="nav-btn" data-view="daily">营销日报</button>
          <button class="nav-btn" data-view="fmcg">快消</button>
          <button class="nav-btn" data-view="baby">母婴</button>
          <button class="nav-btn" data-view="tech3c">3C</button>
          <button class="nav-btn" data-view="report">生成日报</button>
        </nav>
        <span class="login-placeholder" aria-hidden="true">登录</span>
      </div>
    </header>

    <div class="demo-banner" id="dataStatus"></div>

    <main class="container">
      <!-- 全局筛选区：精选 + 全部动态 共用 -->
      <div class="global-controls" id="globalControls">
        <div class="controls-row">
          <input id="searchInput" type="search" placeholder="搜索标题/摘要/品牌/平台..." />
          <select id="tierFilter" aria-label="信源等级">
            <option value="all">全部信源</option>
            <option value="T1">T1 官方/一手</option>
            <option value="T1.5">T1.5 数据/机构</option>
            <option value="T2">T2 媒体/KOL</option>
          </select>
          <button class="clear-btn" id="clearBtn" style="display:none">清空</button>
        </div>
        <div class="filter-bar" id="categoryFilters"></div>
      </div>

      <!-- 精选页 -->
      <section class="view active" id="featuredView">
        <div class="view-header">
          <h1 class="view-title">精选</h1>
          <p class="view-desc">AI 自动挑选的高价值营销内容</p>
        </div>
        <div class="timeline" id="featuredTimeline"></div>
      </section>

      <!-- 趋势观察页 -->
      <section class="view" id="trendsView">
        <div class="view-header">
          <h1 class="view-title">14 天趋势观察</h1>
          <p class="view-desc">从最近 14 天的精选案例中,AI 自动提炼出的跨案例共性趋势 — 不追单条热点,只看一段时间的共同走向</p>
        </div>
        <div class="trends-grid" id="trendsGrid"></div>
      </section>

      <!-- 全部动态页 -->
      <section class="view" id="allView">
        <div class="view-header">
          <h1 class="view-title">全部营销动态</h1>
          <p class="view-desc">所有抓取内容，包括未达精选阈值的条目</p>
        </div>
        <div class="timeline" id="allTimeline"></div>
      </section>

      <!-- 营销日报页 -->
      <section class="view" id="dailyView">
        <div class="view-header">
          <h1 class="view-title">营销日报</h1>
          <p class="view-desc">每日自动汇总，按类别分组</p>
        </div>
        <div class="daily-grid" id="dailyGrid"></div>
      </section>

      <!-- 快消专区 -->
      <section class="view" id="fmcgView">
        <div class="view-header">
          <h1 class="view-title">快消专区</h1>
          <p class="view-desc">食品饮料、日化、美妆个护等快消行业动态</p>
        </div>
        <div class="timeline" id="fmcgTimeline"></div>
      </section>

      <!-- 母婴专区 -->
      <section class="view" id="babyView">
        <div class="view-header">
          <h1 class="view-title">母婴专区</h1>
          <p class="view-desc">母婴、童装、亲子、教育等行业动态</p>
        </div>
        <div class="timeline" id="babyTimeline"></div>
      </section>

      <!-- 3C专区 -->
      <section class="view" id="tech3cView">
        <div class="view-header">
          <h1 class="view-title">3C专区</h1>
          <p class="view-desc">手机、数码、家电、消费电子行业动态</p>
        </div>
        <div class="timeline" id="tech3cTimeline"></div>
      </section>

      <!-- 生成日报页 -->
      <section class="view" id="reportView">
        <div class="view-header">
          <h1 class="view-title">生成日报</h1>
          <p class="view-desc">选择模板和内容，一键生成日报长图</p>
        </div>
        <div class="report-builder" id="reportBuilder"></div>
        <div class="report-preview-wrapper" id="reportPreviewWrapper" style="display:none">
          <div class="report-actions">
            <button class="report-btn" id="reportBackBtn">返回编辑</button>
            <button class="report-btn" id="reportPdfBtn">下载 PDF（带链接）</button>
            <button class="report-btn primary" id="reportDownloadBtn">下载长图</button>
          </div>
          <div class="report-preview-scroll">
            <div id="reportPreview"></div>
          </div>
        </div>
      </section>

    </main>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
